# Hardened static-site server for the nginx-unprivileged base image.
# Listens on 8080 (non-root); see Dockerfile EXPOSE / Kubernetes containerPort.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ----- Security headers -------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-Frame-Options           "DENY"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy    "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; font-src 'self' data: https://fonts.gstatic.com; base-uri 'self'; frame-ancestors 'none'" always;

    # ----- Compression ------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml font/woff2;

    # ----- Health endpoint for Kubernetes liveness/readiness probes ---------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ----- Astro's content-hashed assets: cache hard ------------------------
    location /_astro/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----- App routes -------------------------------------------------------
    location / {
        # Astro builds directory-style output (/about/ -> /about/index.html)
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
