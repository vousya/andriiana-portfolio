apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

# CI overrides the tag/digest with: kustomize edit set image ...
images:
  - name: ghcr.io/vousya/andriiana-portfolio
    newTag: latest

commonLabels:
  app.kubernetes.io/part-of: andriiana-portfolio
  app.kubernetes.io/managed-by: kustomize
